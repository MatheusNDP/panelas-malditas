# Exporta o jogo para a web com o Godot e publica no GitHub Pages a cada push na main.
# O site fica em https://matheusndp.github.io/panelas-malditas/
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Só uma publicação por vez; uma nova cancela a que ainda estava esperando.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSAO: 4.7.2

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O Godot e os modelos de exportação (1,3 GB) ficam guardados entre as publicações.
      - name: Cache do Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSAO }}

      - name: Baixar o Godot e os modelos de exportação
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSAO}-stable"
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSAO}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSAO}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o modelos.tpz "$base/Godot_v${GODOT_VERSAO}-stable_export_templates.tpz"
          unzip -q modelos.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSAO}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSAO}.stable/

      - name: Exportar para a web
        run: |
          mkdir -p build/web
          # A primeira abertura importa os desenhos e sons; depois exporta.
          ~/godot/godot --headless --import --path . || true
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar:
    needs: exportar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
